services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./mlruns:/app/mlruns
    depends_on:
      - mlflow
  mlflow:
    image: python:3.11-slim
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      sh -c "pip install mlflow && 
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow"
volumes:
  mlflow_data: